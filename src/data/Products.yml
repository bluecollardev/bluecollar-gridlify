    mockup: /images/portfolio/bc-showcase-pocketpt.png
    intro: >-
      Mediashare is a media-sharing platform for people who teach with video. Content
      is organised into playlists — a session, a programme, a course — that can be
      shared with a person, a group or the public, and watched on a phone as easily as
      on a laptop.
    features:
      - title: Playlists, not clips
        body: >-
          Group videos into a session someone can follow from beginning to end, ordered
          the way you want them taught, with tagging and search across the library.
      - title: Share with people you choose
        body: >-
          Connections, email invitations and per-item visibility, so a playlist reaches
          a patient, a class or everyone, and nothing else leaks.
      - title: One app, every device
        body: >-
          React Native and Expo give you iOS, Android and web from a single codebase,
          with a shared component library keeping them consistent.
      - title: Services you can host yourself
        body: >-
          An Nx monorepo of NestJS microservices — media, users, tagging and analytics —
          over MongoDB, documented with OpenAPI and shipped with generated typed clients.
    screenshots:
      - src: /images/products/mediashare/playlists.jpg
        caption: Browse the library by body region, programme and training focus
      - src: /images/products/mediashare/playlist.jpg
        caption: A playlist plays start to finish, with its own description and tags
      - src: /images/products/mediashare/phone-playlists.jpg
        portrait: true
        caption: The same library on a phone
      - src: /images/products/mediashare/phone-playlist.jpg
        portrait: true
        caption: Playback and sharing on mobile
  - name: Rental.Cloud
    ai:
      title: AI that does the typing for you
      intro: >-
        The platform speaks Model Context Protocol, so an assistant can work your listings
        the way a person would — search them, read them, write them and keep them current —
        through the same API, the same tokens and the same permissions as the app itself.
      items:
        - title: Write a listing by describing it
          status: live
          body: >-
            Tell the assistant about the place in plain sentences and it pulls out the
            title, description, type, price, beds and amenities, then creates the listing
            on your account. Editing works the same way — change the price or rewrite the
            blurb without opening a form.
        - title: Search the way you would ask
          status: live
          body: >-
            "A two-bedroom house in Hua Hin under 20,000 a month" becomes a real query over
            active listings — location, type, purpose, price range, bedrooms — and comes
            back with the matches and their full details.
        - title: An MCP server, not a chatbot bolted on
          status: live
          body: >-
            One endpoint exposes the listing tools to any MCP client — Claude Desktop, an
            editor, your own agent — so the assistant drives the real API rather than a
            copy of your data. The same tools power the chat widget inside the app.
        - title: What your token can do, the agent can do
          status: live
          body: >-
            With no token it reads only what the public site shows. Creating needs a
            subscriber token on a lister plan. Editing is owner-only, checked per listing.
            The agent inherits your permissions exactly and cannot reach past them.
        - title: Built on Claude
          status: live
          body: >-
            Anthropic's Claude Sonnet, with the listing tools handed to it directly, so it
            picks the right one for what you asked and answers with the result rather than
            telling you where to click.
        - title: Your own key, your own node
          status: live
          body: >-
            Each node holds its own Anthropic key in configuration, masked once saved, and
            the assistant stays switched off until you add one. The AI runs on your
            account, against your data, on the node you host.
        - title: Talk to it — voice chat
          status: soon
          body: >-
            Voice in and out over the same assistant, with ElevenLabs doing the speech, so
            a lister could add or change a property while driving. Not built yet — tell us
            you want it and we will move it up the list.
      note: >-
        Everything marked live runs today against the listings API and has been tested end
        to end. Want a demo, or the same thing pointed at your own data? Get in touch.
