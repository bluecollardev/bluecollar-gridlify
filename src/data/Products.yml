          note: Mobile app, four NestJS services and shared libraries
          commits: '549'
          contributors: '2'
          span: 2026
    mockup: /images/portfolio/bc-showcase-pocketpt.png
    intro: >-
      Mediashare is a media-sharing platform for people who teach with video. Content
      is organised into playlists — a session, a programme, a course — that can be
      shared with a person, a group or the public, and watched on a phone as easily as
      on a laptop.
    features:
      - title: Playlists, not clips
        body: >-
          Group videos into a session someone can follow from beginning to end, ordered
          the way you want them taught, with tagging and search across the library.
      - title: Share with people you choose
        body: >-
          Connections, email invitations and per-item visibility, so a playlist reaches
          a patient, a class or everyone, and nothing else leaks.
      - title: One app, every device
        body: >-
          React Native and Expo give you iOS, Android and web from a single codebase,
          with a shared component library keeping them consistent.
      - title: Services you can host yourself
        body: >-
          An Nx monorepo of NestJS microservices — media, users, tagging and analytics —
          over MongoDB, documented with OpenAPI and shipped with generated typed clients.
    screenshots:
      - src: /images/products/mediashare/playlists.jpg
        caption: Browse the library by body region, programme and training focus
      - src: /images/products/mediashare/playlist.jpg
        caption: A playlist plays start to finish, with its own description and tags
      - src: /images/products/mediashare/phone-playlists.jpg
        portrait: true
        caption: The same library on a phone
      - src: /images/products/mediashare/phone-playlist.jpg
        portrait: true
        caption: Playback and sharing on mobile
  - name: Rental.Cloud
    ai:
      title: AI that does the typing for you
      intro: >-
        The platform speaks Model Context Protocol, so an AI assistant can work your
        listings the way a person would — search them, read them, write them and keep
        them current — through the same API and the same permissions as the app.
      items:
        - title: Write a listing for me
          status: live
          body: >-
            Describe the place in a sentence and the assistant drafts the title,
            description and details, then creates the listing on your account. It can
            update one later just as easily — change the price, rewrite the blurb, add
            photos — without you opening a form.
        - title: Search in plain language
          status: live
          body: >-
            "Two-bedroom near the beach in Hua Hin under 20,000 a month" resolves to a
            real query — city lookup, listing type, price range, bedrooms — and comes
            back with the matching properties and their full details.
        - title: An MCP server, not a chatbot bolted on
          status: live
          body: >-
            One endpoint exposes the listing tools to any MCP client — Claude Desktop, an
            editor, your own agent. Reads are open; anything that writes goes through the
            same token and ownership checks as the rest of the API.
        - title: Built on Claude
          status: live
          body: >-
            The assistant runs on Anthropic's Claude Sonnet with the listing tools handed
            to it directly, so it chains steps by itself: find the city, check what is
            there, then write the listing.
        - title: Your own key, your own account
          status: live
          body: >-
            Each node holds its own Anthropic key in configuration, so the AI features run
            on your account and your terms — no shared quota, and nothing leaves the node
            you host.
        - title: Talk to it — voice chat
          status: soon
          body: >-
            Voice in and out over the same assistant, with ElevenLabs doing the speech, so
            a lister can add or change a property while driving. Not built yet — tell us
            if you want it and we will move it up.
      note: >-
        Everything marked live runs today against the listings API and has been tested
        end to end. Want a demo, or the same thing pointed at your own data? Get in touch.
    builds:
      checked: 18 Sep 2026
      items:
        - name: Customer site
          status: passing
        - name: Merchant dashboard
          status: passing
        - name: Marketing site
          status: passing
    slug: rental-cloud
    icon: /images/projects/rental-cloud.svg
    tagline: The self-hosted alternative to Airbnb and Booking.com
    description: >-
      An open-concept rental marketplace app that ties into the Rental.Cloud network,
      so customers run and fine tune their own product rather than renting space on
      someone else's. Behind it sits a multi-tenant platform: listings and search,
      Stripe payments, subscriptions and merchant payouts with configurable fees and
      commissions, and iOS and Android builds.
