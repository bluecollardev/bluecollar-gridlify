    slug: entraprise
    icon: /images/projects/entraprise.svg
    tagline: Member and operations apps on Microsoft Entra ID
    description: >-
      Role-gated applications for member-based organizations: user management with
      roles and permissions, timekeeping, expenses, event calendars, notifications and
      WordPress integration. Single sign-on and Microsoft 365 gating through Microsoft
      Entra ID, deployed on Azure.
    technologies: TypeScript, React Native, Expo, NestJS, PostgreSQL, Microsoft Entra ID, Azure
    openSource: true
    git:
      summary: 1 repository · 1,511 commits · mobile, API and infrastructure
      total: '1,511'
      duration: 4 mo
      first: May 2026
      last: Sep 2026
      years:
        - year: '2026'
          total: '1,511'
          levels: ''
      repos:
        - name: entraprise
          note: React Native app, NestJS API, Azure infrastructure and docs
          commits: 1,511
          contributors: '3'
          span: May 2026 – Sep 2026
    mockup: /images/products/entraprise/mockup.png
    intro: >-
      Entraprise runs the day to day of a member-based organization: who belongs, what
      they are entitled to see, the hours worked, the money spent and the events coming
      up — with sign-in and access handled by the Microsoft account the organization
      already pays for.
    features:
      - title: Members, roles and permissions
        body: >-
          User management with role-gated access, so the public, members and staff each
          see their own view of the same application.
      - title: Single sign-on and 365 gating
        body: >-
          Microsoft Entra ID for sign-in and Microsoft 365 gating, with Graph integration
          for password self-service and silent token refresh.
      - title: Timekeeping and expenses
        body: >-
          Billable time entry with account coding, pay periods and approvals, expense
          tracking, and branded PDF reports.
      - title: Events, notices and records
        body: >-
          Event calendars, notifications and public records, alongside WordPress
          integration for the public site.
