    tagline: Open-source media sharing for React Native and NestJS
    description: >-
      The platform behind PocketPT (Pocket Physical Therapist): playlists of short
      instructional videos, sharing, connections and tagging. A React Native and Expo
      app over an Nx monorepo of NestJS microservices, with OpenAPI-generated clients.
    technologies: TypeScript, React Native, Expo, NestJS, Nx, MongoDB, OpenAPI, AWS
