    active: Mar 2020 – Jan 2021
    prs: '119'
    cadence: 5.4 pull requests per two-week sprint
    owner: bcgov
    org: Service BC — BC Registries
    role: Lead developer on the public-facing application
    summary: >-
      The business- and organisation-name examination, research and approval engine
      and its public UI: a synonyms API and Python client, word classification,
      extra-provincial name handling, conflict analysis, payments, and NATS event
      queues for state changes and notifications.
    technologies: Python, Flask, Marshmallow, PostgreSQL, Solr, NATS, Vue.js, Keycloak
    live: https://names.bcregistry.gov.bc.ca
    repos:
      - name: bcgov/namex
