title: Open Source at Heart
subtitle: >-
  We have worked on open source for years, and we like to give back to the
  community that we build on.
items:
  - name: Mediashare
    icon: /images/projects/mediashare.svg
    tagline: Open-source media sharing for React Native and NestJS
    description: >-
      The platform behind PocketPT (Pocket Physical Therapist): playlists of short
      instructional videos, sharing, connections and tagging. A React Native and Expo
      app over an Nx monorepo of NestJS microservices, with OpenAPI-generated clients.
    technologies: TypeScript, React Native, Expo, NestJS, Nx, MongoDB, OpenAPI, AWS
    github: https://github.com/bluecollardev/mediashare
    url: https://app.drafehr.com
    openSource: true
  - name: Rental.Cloud
    icon: /images/projects/rental-cloud.svg
    tagline: The self-hosted alternative to Airbnb and Booking.com
    description: >-
      An open-source rental marketplace app that ties into the Rental.Cloud network,
      so customers run and fine tune their own product rather than renting space on
      someone else's. Behind it sits a multi-tenant platform: listings and search,
      Stripe payments, subscriptions and merchant payouts, and iOS and Android
      builds.
    technologies: Vue 3, TypeScript, Capacitor, Laravel, PHP, MySQL, Stripe, RabbitMQ, Docker
    openSource: false
  - name: Entraprise
    icon: /images/projects/entraprise.svg
    tagline: Member and operations apps on Microsoft Entra ID
    description: >-
      Role-gated applications for member-based organizations: a member app with events,
      notifications, public records and billable time keeping, plus a referrals system
      with GIS mapping. Single sign-on through Microsoft Entra ID, deployed on Azure.
    technologies: TypeScript, React Native, Expo, NestJS, PostgreSQL, PostGIS, Microsoft Entra ID, Azure
    openSource: false
