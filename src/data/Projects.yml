title: Projects
subtitle: Products and platforms we build and maintain.
items:
  - name: Mediashare
    tagline: Open-source media sharing for React Native and NestJS
    description: >-
      The platform behind PocketPT (Pocket Physical Therapist): playlists of short
      instructional videos, sharing, connections and tagging. A React Native and Expo
      app over an Nx monorepo of NestJS microservices, with OpenAPI-generated clients.
    technologies: TypeScript, React Native, Expo, NestJS, Nx, MongoDB, OpenAPI, AWS
    github: https://github.com/bluecollardev/mediashare
    url: https://app.drafehr.com
    openSource: true
  - name: Rental.Cloud
    tagline: The open-source, self-hosted alternative to Airbnb and Booking.com
    description: >-
      Run your own rental marketplace instead of renting space on someone else's.
      A multi-tenant, white-label listings platform behind CrashPad411 and others:
      listings and search, Stripe payments, subscriptions and merchant payouts, and
      iOS and Android apps. The front end is open source and ties into the network,
      so customers can fine tune their own product.
    technologies: Vue 3, TypeScript, Capacitor, Laravel, PHP, MySQL, Stripe, RabbitMQ, Docker
    url: https://crashpad411.com
    openSource: false
  - name: Entraprise
    tagline: Community and operations apps for First Nations
    description: >-
      Role-gated community applications built for Skin Tyee First Nation: a member app
      with events, notifications, records and billable time keeping, plus a consultation
      referrals system with GIS mapping, all on Microsoft Entra ID and Azure.
    technologies: TypeScript, React Native, Expo, NestJS, PostgreSQL, PostGIS, Microsoft Entra ID, Azure
    openSource: false
