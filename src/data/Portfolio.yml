  - client: CrashPad411.com
    description: >-
      **The Client**


      CrashPad411.com is the #1 listings site for air-crew accommodation, serving
      more than 50,000 in-flight crew members in hundreds of cities worldwide, with
      thousands of crashpad listings and more than 270,000 messages sent. A crashpad is a place
      for airline personnel to stay when on reserve duty, on early-morning flights,
      or commuting to base. Under the hood it is a multi-tenant rental-listings SaaS,
      white labeled for enterprise / B2B customers.


      **The Problem**


      Brought on by the founder to modernize the stack, our brief was to give the
      platform its first automated DevOps foundation — CI/CD, containerized
      deployment and multi-tenant provisioning — and to modernize the full stack
      end to end, from the customer web and mobile apps through to the Laravel
      backend and its payments engine.


      **Our Solution**


      As Technical Lead we owned the architecture and led all six repositories end
      to end, modernizing the full stack and consolidating the platform's separate
      applications into a scalable, financially reconcilable, multi-tenant SaaS.

      - Set up the platform's first CI/CD, GitLab pipelines deploying to DigitalOcean, moving deployment onto automated, version-controlled, containerized releases

      - Authored the Azure DevOps pipelines that followed, deploying to DigitalOcean with Azure Key Vault secrets, Azure DNS, a declaratively configured Kong gateway behind an Nginx reverse proxy with Let's Encrypt SSL, and MySQL backup and restore to Azure Blob Storage

      - Led the Vue 2 to Vue 3 (Composition API) migration, consolidating the customer web app, the merchant dashboard and six shared @properties/* packages into a single pnpm monorepo

      - Built server-side rendering for the customer web app on Express, with performance work on assets, bundles and lazy-loaded translations

      - Shipped iOS and Android apps with Capacitor (push notifications and geolocation), built through Fastlane and TestFlight

      - Rebuilt the payments and subscription engine from scratch on Stripe (Connect merchant payouts, subscriptions, AutoPay rent collection, duplicate-charge protection) with a complete, auditable ledger that reconciles with Stripe

      - Drove the PHP 7 to 8 and Laravel 8 to 11 upgrades; delivered single sign-on and login-as-user impersonation over OAuth2, a Laravel Nova admin, websockets and a Laravel MCP server exposing the listings API to AI agents

      - Architected the 9-node white-label network (a dot.properties master federating tenant sites over RabbitMQ) and a self-service SaaS onboarding portal with Stripe billing, trials and partner referrals

      - Led a complete UI/UX redesign, with Stripe checkout, subscription and AutoPay flows and Google Maps listing search


      **Technologies**


      Vue 3 (SSR, Composition API), TypeScript, Vite, pnpm, Vuex, Node.js,
      Express, Capacitor, Laravel 11, PHP 8.2, Laravel Nova, Laravel Passport
      (OAuth2), Reverb, Socket.io, Python, Bottle, MySQL, MongoDB, Redis, Stripe
      Connect, RabbitMQ, Kong, Nginx, Docker, GitLab CI, Azure DevOps, DigitalOcean,
      Azure (Static Web Apps, DNS, Key Vault, Blob Storage), Cypress, Storybook
    endDate: 2026-01-01T12:00:00.000Z
