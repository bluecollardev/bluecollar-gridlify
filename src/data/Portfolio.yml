  - client: Skin Tyee First Nation
    description: >-
      **The Client**


      Skin Tyee First Nation is a proud Wet'suwet'en community on the shores of
      Francois Lake in northern British Columbia.


      **The Problem**


      The Nation needed modern technology it could own and govern itself: identity
      and single sign-on for staff, a website it controls, and a way to keep band
      members informed and involved, with the design kept auditable and the data
      governable by the Nation.


      **Our Solution**


      Contracted as the Nation's IT System Architect, we took on its technology end
      to end (identity, cloud, network, data sovereignty, security and custom
      software) and delivered a working, cloud-first Microsoft and Azure stack
      alongside a suite of purpose-built applications.

      - A role-gated community app in React Native and Expo (public, band member, and admin and staff views): dashboard, member directory, community events, notifications, band meetings, public records and transparency reporting, and polling and surveys

      - A billable time-keeping module with account coding, pay periods, approvals, charts and branded PDF timesheet reports

      - A Consultation Referrals system with reserve and territory GIS map layers (PostGIS), versioned records and branded PDF reports, with documents stored in both SharePoint and Azure Blob Storage, plus an MCP server for AI search across referrals and documents

      - Migrated skintyee.ca off Site123 to a self-hosted, headless WordPress stack on Azure Container Apps, with Azure DevOps CI/CD and a managed database with automated backups and point-in-time restore

      - A contract-first NestJS API (OpenAPI) with PostGIS for land allocation and mapping, role-gated through Microsoft Entra ID

      - Single sign-on on Microsoft Entra ID across Microsoft 365 and the custom apps, with Microsoft Graph integration

      - Data-sovereignty policy for First Nations data governance, and backup and disaster-recovery planning


      **Technologies**


      Microsoft Azure (Container Apps, Blob Storage, managed databases, DNS/TLS),
      Microsoft 365, Microsoft Entra ID, Microsoft Graph, SharePoint, TypeScript,
      React Native, Expo, Node.js, NestJS, Prisma, PostgreSQL, PostGIS, ArcGIS,
      WordPress, Azure DevOps, Aspire, PowerShell, Anthropic Claude, MCP
