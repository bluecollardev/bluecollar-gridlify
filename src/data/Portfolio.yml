  - client: Caffe Tech 2004 Ltd.
    description: >-
      **The Client**


      Caffe Tech is an Edmonton-based importer and distributor of premium
      (primarily Italian and Swiss) commercial and home espresso equipment, with
      sister businesses Leva Cafe and Ace Coffee Roasters.


      **The Problem**


      With its stores migrated from Magento to QuickCommerce, and the business
      expanding and opening new locations, Caffe Tech needed an inventory
      management solution that would synchronize QuickBooks customers, inventory
      and stock levels, invoices, work orders and more with its e-commerce
      websites (Caffe Tech, Leva and Ace Coffee Roasters). Its catalogue of 5,000
      to 10,000 espresso-machine parts had also never been properly catalogued.


      **Our Solution**


      We designed an event-driven software bridge: an OAuth2-secured RESTful
      microservice plus custom "client" extensions for QuickCommerce (OpenCart)
      that automatically synchronized data across multiple installations and
      software systems.

      - Kept inventory synced live between QuickBooks Online and the online stores

      - Catalogued the full parts inventory into QuickBooks, reconciled stock quantities for tax records, then migrated the business to QuickBooks Online

      - Built custom inventory-management and invoicing micro-apps

      - Brought the network infrastructure under control, running Microsoft Small Business Server virtualized on new Apple equipment, and trained staff across all three businesses


      **Technologies**


      HTML5, SASS, JavaScript, jQuery, PHP, Slim, Doctrine ORM/DBAL, QuickBooks
      PHP SDK, QuickBooks Online API, QuickBooks Desktop SDK, OpenCart,
      QuickCommerce, Bash, PHPUnit, REST, JSON, Swagger, Swagger Codegen, OAuth2,
      MySQL, CentOS, Windows Small Business Server, Parallels, Git
