  - client: Interdynamix
    description: >-
      **The Client**


      Ideal is an automotive fintech startup, incubated in-house by Interdynamix
      (now Carbeeza), whose product is a SaaS-style, machine-learning enhanced
      business intelligence platform for automotive inventory holders, retailers
      and lenders. The platform uses AI to make car-buying easier, matching buyers
      to their ideal vehicle and folding financing discovery into the process.


      **The Problem**


      The platform had to draw on data held separately by inventory holders,
      retailers and lenders and bring it into one consumer portal and dealer
      application, behind a single sign-on — with its first iteration ready for
      the company's initial funding round.


      **Our Solution**


      We joined at the early-stage startup phase as Frontend Applications Lead and
      drove the front-end for the platform's first iteration, through the
      company's initial funding round.

      - Built the consumer portal and dealer applications in React, and made the front-end platform decisions

      - Prototyped application screens and workflows with stakeholders

      - Integrated SSO-style authentication using Red Hat's Keycloak

      - Built and tested Node.js microservices supporting the front-end

      - Integrated against documented, contract-first service APIs owned by the backend team

      - Containerized the front-end applications for deployment on OpenShift


      The client-side apps communicate over RESTful APIs with headless web API
      service instances representing the inventory holders, retailers and lenders
      within an organization. The distributed backends are written in Java using
      Spring Boot and Hibernate, communicate with each other through the RabbitMQ
      message broker, and store data in PostgreSQL.


      **Technologies**


      HTML5, ES6, ES7, SASS, JSX, ReactJS, Flux, Material-UI, MobX,
      React-Bootstrap, DevExpress, Bluebird, Node.js, Java, Spring Boot,
      Hibernate, Swagger, Swagger Codegen, OpenAPI, PostgreSQL, RabbitMQ,
      Keycloak, Gulp, Webpack, Karma, Mocha, Chai, Expect.js, Jest, Docker,
      Kubernetes, OpenShift, VirtualBox, WebStorm, Spring Tool Suite, Adobe CC
      (Photoshop, Illustrator, etc.), RESTful API design, UI Design, GitLab, Git
