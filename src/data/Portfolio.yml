  - client: Dr. Adam Fehr
    description: >-
      **The Client**


      Dr. Adam Fehr, MD, DPT, wanted a mobile app to house and easily share his
      exercise videos with his patients and clients.


      **The Problem**


      Dr. Fehr needed one place to house a growing library of instructional
      videos, and an easy way to share a whole session's worth of them with a
      patient or client.


      **Our Solution**


      We designed and built PocketPT (Pocket Physical Therapist) end to end, and
      continue to develop it. It is an instructional-video media-sharing platform
      where users follow playlists of 5 to 10 short videos, a typical physiotherapy
      or workout session, drawn from a catalogue of around 1,000 instructional
      videos. It is live at app.drafehr.com.

      - A cross-platform mobile and web app in React Native and Expo with Redux Toolkit and a shared component library: playlist creation and playback, media sharing, user connections, email invitations, search and tagging

      - Programs organized by body region, program and training focus, with exercise progressions ordered by intensity

      - An Nx monorepo of four NestJS microservices (media, users, tagging, and analytics and tracking) over MongoDB, with OpenAPI specs and generated, typed clients

      - Authentication on AWS Cognito and media storage on AWS S3, deployed to AWS Lightsail in Docker containers with automated GitLab CI/CD and a Node provisioning CLI


      **Technologies**


      TypeScript, React Native, Expo, Redux Toolkit, NestJS, Nx, MongoDB, TypeORM,
      OpenAPI, AWS (Cognito, S3, Lightsail), Docker, GitLab CI
